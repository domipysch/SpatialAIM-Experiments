[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spatialaim-experiments"
version = "0.1.0"
description = "Experiments and figures for the SpatialAIM paper; uses the spatial-aim package"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dominik Pysch", email = "dominik.pysch@fau.de" }]

# Everything here is already in spatialaim_env, which is the environment the experiments
# run in (see README). Install with --no-deps so pip never tries to resolve the
# scientific stack or fetch spatial-aim over the network:
#
#     pip install -e . --no-deps
dependencies = [
    "spatial-aim",     # the method under study, installed from SpatialAIM-Repository
    "anndata",
    "matplotlib",
    "numpy",
    "openpyxl",        # the supplementary dataset tables
    "pandas",
    "pyyaml",
    "scikit-learn",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
